name: CI

# Only fires on tag pushes. Branch pushes to main and PRs are already fully
# covered by test.yml (coverage, lint, schema check, MariaDB, security scans);
# running a second, thinner test job on every push/PR was pure duplication.
# The `gate` job calls test.yml (workflow_call) because tag pushes are NOT covered
# by its `branches: [main, develop]` trigger; it gates docker/release.
on:
  push:
    tags: ['v*']

jobs:
  # Full suite (coverage, lint, schema, MariaDB, security scans, frontend)
  # reused from test.yml; nothing is pushed unless it is green.
  gate:
    name: Full test suite
    uses: ./.github/workflows/test.yml

  docker:
    name: Build & Push Docker
    needs: gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/carryozor/hygie:latest' || '' }}
            ghcr.io/carryozor/hygie:${{ steps.version.outputs.VERSION }}

  release:
    name: GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract section for this version, strip the header line
          NOTES=$(awk '
            /^## \['"${VERSION}"'\]/ { flag=1; next }
            flag && /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES=$(git log --pretty=format:"- %s" --no-merges | head -30)
          fi
          # Write to a file — avoids heredoc delimiter collision and
          # length limits on GITHUB_OUTPUT for large changelogs.
          echo "$NOTES" > /tmp/changelog-section.md
          echo "notes_file=/tmp/changelog-section.md" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        # FIX: pass NOTES via env var, not ${{ }} inline substitution.
        # Inlining ${{ steps.changelog.outputs.NOTES }} directly into a `run:` shell
        # script causes bash to interpret backticks in the CHANGELOG as command
        # substitution, breaking the release step whenever release notes contain
        # inline code like `get_users()` or `f"plex:{server_id}"`.
        # Using env: passes the value as a real shell variable ($NOTES) where
        # backticks inside double-quoted expansions are safe string content.
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          NOTES_FILE="${{ steps.changelog.outputs.notes_file }}"

          # Build the release body in a temp file — avoids all quoting issues
          {
            echo "## Docker"
            echo ""
            echo '```yaml'
            echo "image: ghcr.io/carryozor/hygie:${VERSION}"
            echo '```'
            echo ""
            echo "## Release Notes"
            echo ""
            cat "$NOTES_FILE"
            echo ""
            echo "---"
            echo "Full details in [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md)."
          } > /tmp/release-body.md

          # Pre-release tags (v4.6.0-rc1) must never be flagged as the latest release.
          PRERELEASE=""
          case "${VERSION}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          if gh release view "v${VERSION}" --repo "${REPO}" &>/dev/null; then
            gh release edit "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file /tmp/release-body.md \
              ${PRERELEASE} \
              --repo "${REPO}"
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file /tmp/release-body.md \
              ${PRERELEASE} \
              --repo "${REPO}"
          fi
