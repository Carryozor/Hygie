[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# F401 enforced since v4.2.0 — the codebase was swept clean (66 → 0). Modules
# that expose DB_PATH as a test monkeypatch target carry an explicit
# `# noqa: F401` with a reason; __init__.py re-export barrels declare `__all__`.
select = ["E", "F401"]
ignore = [
    "E501",   # line too long
    "E402",   # module import not at top — needed for late imports
    "E701",   # multiple statements on one line (colon) — intentional guards
    "E702",   # multiple statements on one line (semicolon) — intentional
    "E711",   # comparison to None — explicit style choice
    "E712",   # comparison to True/False — explicit style choice
]
