# .github/workflows/test.yml
name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    # Live MariaDB so the coverage/lint/schema gate also exercises the
    # dual-dialect write paths. Without it this job ran SQLite-only, so the
    # comprehensive gate never covered the dialect that broke prod (v4.1.1).
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: hygie
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check schema consistency
        run: python3 scripts/check-schema.py

      - name: Run tests with coverage (SQLite + MariaDB)
        timeout-minutes: 10
        env:
          TEST_MARIADB_URL: mysql+aiomysql://root:ci@127.0.0.1:3306/hygie
        run: |
          python3 -m pytest -q --tb=short --timeout=60 \
            --cov=backend \
            --cov-report=term-missing \
            --cov-fail-under=50

      - name: Lint (ruff)
        run: python3 -m ruff check backend/ tests/

      # Enforcing since v4.2.0 — baseline was cleaned (66 known CVEs fixed by
      # pinning patched versions; bandit findings are hardened SQL-identifier
      # patterns reviewed and marked `# nosec` with a one-line justification
      # each). A red run here means an actual new advisory, not noise.
      - name: Security scan — dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Security scan — code (bandit)
        run: |
          pip install bandit
          bandit -r backend/ -ll

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/vue/package-lock.json

      - name: Install dependencies
        working-directory: frontend/vue
        run: npm ci

      - name: Run unit tests
        working-directory: frontend/vue
        run: npm run test:unit

      - name: Lint
        working-directory: frontend/vue
        run: npm run lint

      - name: Build frontend
        working-directory: frontend/vue
        run: npm run build

      # Enforcing since v4.2.0 — see backend security scans above.
      - name: Security scan — npm audit
        working-directory: frontend/vue
        run: npm audit --audit-level=high
